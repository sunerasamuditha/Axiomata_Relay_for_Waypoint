[project]
name = "relay-engine"
version = "1.0.0"
description = "Waypoint delivery planning: CP-SAT allocation, timetable, deferral explanations, validator"
requires-python = ">=3.11"
dependencies = ["ortools>=9.10,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay_engine"]
