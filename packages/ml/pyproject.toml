[project]
name = "relay-ml"
version = "1.0.0"
description = "Stop service-time and lateness predictions, weekly demand forecast, outlet profiles"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "lightgbm>=4.3"]

[project.optional-dependencies]
train = ["pandas>=2.2", "scikit-learn>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay_ml"]
